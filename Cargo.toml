[package]
name = "n-apt-backend"
version = "0.5.0"
license = "Hippocratic-3.0"
edition = "2021"
authors = ["Ceane Lamerez"]
description = "Visualize FFTs/waterfalls, capture a snapshot or I/Q capture & more, tailored toward N-APT signals. Analyze, learn, record, document & demodulate N-APT signals."
repository = "https://github.com/ceane/n-apt"

[lib]
name = "n_apt_backend"
path = "src/rs/lib.rs"
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "n-apt-backend"
path = "src/rs/server/main_bin.rs"

[[test]]
name = "fft_processor_tests"
path = "test/rust/fft_processor_tests.rs"

[[test]]
name = "device_stream_frozen_tests"
path = "test/rust/device_stream_frozen_tests.rs"

[[test]]
name = "authentication_tests"
path = "test/rust/authentication_tests.rs"

[[test]]
name = "mock_apt_tests"
path = "test/rust/mock_apt_tests.rs"

[[test]]
name = "server_tests"
path = "test/rust/server_tests.rs"

[[test]]
name = "capture_stitch_tests"
path = "test/rust/capture_stitch_tests.rs"

[[test]]
name = "frequency_scaling_e2e"
path = "test/rust/frequency_scaling_e2e.rs"

[[test]]
name = "encryption_e2e_tests"
path = "test/rust/encryption_e2e_tests.rs"

[[test]]
name = "performance_tests"
path = "test/rust/performance_tests.rs"

[[test]]
name = "performance_program_tests"
path = "test/rust/performance_program_tests.rs"

[[test]]
name = "frequency_validation_tests"
path = "test/rust/frequency_validation_tests.rs"

[[test]]
name = "iq_capture_integration_tests"
path = "test/rust/iq_capture_integration_tests.rs"

[[test]]
name = "hardware_failure_recovery_tests"
path = "test/rust/hardware_failure_recovery_tests.rs"

[[test]]
name = "hotplug_manual_tests"
path = "test/rust/hotplug_manual_tests.rs"

[[test]]
name = "endpoint_auth_tests"
path = "test/rust/endpoint_auth_tests.rs"

[[test]]
name = "bandwidth_tests"
path = "test/rust/bandwidth_tests.rs"

[[test]]
name = "hackrf_integration_tests"
path = "test/rust/hackrf_integration_tests.rs"

[[test]]
name = "reload_tests"
path = "test/rust/reload_tests.rs"

[[test]]
name = "stream_manager_tests"
path = "test/rust/stream_manager_tests.rs"

[[bin]]
name = "live_stream_test"
path = "src/rs/bin/live_stream_test.rs"

[[bin]]
name = "dump_config"
path = "src/rs/bin/dump_config.rs"

[[bench]]
name = "pipeline_benchmarks"
path = "test/benchmarks/pipeline_benchmarks.rs"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rs_decrypted)'] }

[features]
default = []
mock_apt_metal = ["dep:metal"]

[dependencies]

# Core dependencies (always included)
rustfft = "6"
num-complex = "0.4"
rand = ">=0.10.1, <0.11"
paste = { package = "pastey", version = "0.1.1" }
rayon = "1.12"
getrandom = { version = "0.4", features = ["wasm_js"] }
anyhow = ">=1.0.103, <2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = "1.25.0"
url = "2"
log = "0.4"
clap = { version = "4.6", features = ["derive"] }
byteorder = "1.5"
env_logger = "0.11"
dotenvy = "0.15"
wasm-bindgen = "0.2.121"
serde-wasm-bindgen = "0.6"

# WASM dependencies (only when targeting WASM)
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.98"
web-sys = { version = "0.3.98", features = ["console"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.31", optional = true }

# Server dependencies (only when not targeting WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = "0.29"
redis = { version = "1.2", features = ["aio", "tokio-comp"] }
env_logger = "0.11"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
# Encryption: AES-256-GCM for payload encryption, HMAC/PBKDF2 for auth
aes-gcm = "0.10"
hmac = "0.13"
sha2 = "0.11"
pbkdf2 = { version = "0.13", features = ["password-hash"] }
base64 = "0.22"
zip = { version = "8", default-features = false }
# HTTP client for CoreML service communication
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# HTTP + WebSocket server (axum replaces raw TcpListener + tokio-tungstenite)
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "set-header", "compression-gzip"] }
# WebAuthn passkey authentication
webauthn-rs = { version = "0.5", default-features = false }
webauthn-rs-proto = "0.5"
# Session management
uuid = { version = "1", features = ["v4"] }
# Hot reloading and configuration
notify = "8.2"
serde_yaml = "0.9"
regex = "1"
# Input validation and sanitization
validator = { version = "0.20", features = ["derive"] }
indexmap = { version = "2.14", features = ["serde"] }
crossbeam-channel = "0.5"
yawc = { version = "0.3.3", features = ["axum", "zlib"] }
tempfile = "3"
serde_urlencoded = "0.7"
rusb = "0.9"

[dev-dependencies]
doc-comment = "0.3"
tempfile = "3"
serial_test = "3.2"
criterion = { version = "0.8", features = ["html_reports"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-test = "0.4"
axum-test = { version = "20", features = ["ws"] }
tower = "0.5"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.70"
[build-dependencies]
pkg-config = "0.3"

# Server configuration
[package.metadata.server]
host = "127.0.0.1"
port = 8765

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[profile.dev]
opt-level = 0
incremental = true
debug = true
codegen-units = 16

[profile.dev-fast]
inherits = "dev"
opt-level = 3
debug = 1
debug-assertions = false
overflow-checks = false
codegen-units = 1
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
overflow-checks = false

[[bin]]
name = "test_fft"
path = "src/rs/bin/test_fft.rs"
