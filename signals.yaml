# Signals Configuration for N-APT
# This file contains mock signal generation, n-apt frame definitions, and SDR settings
# Can be edited while the server is running to test different configurations
#
# Backend Usage (src/rs/server/utils.rs):
# - Loaded at startup via signals_config() using serde_yaml
# - n_apt.channels are parsed and converted to SpectrumFrameMessage objects
# - These messages are sent via WebSocket to the frontend to display N-APT channel boundaries
# - The frontend uses these channel definitions to visualize frequency ranges on the spectrum display
# - SDR settings (sample_rate, center_frequency, gain, etc.) are loaded and applied to the hardware
# - Mock APT settings are used for generating test signals when no real SDR is connected

signals:
  # Available frequency range for the spectrum display (not device-specific)
  available_spectrum:
    min_freq: !frequency 0Hz
    max_freq: !frequency 30GHz

  # SDR hardware and processing settings
  sdr:
    # Sample rate for SDR processing
    sample_rate: !frequency 3.2MHz
    fft_sizes:
      - base: base_fft_sizes
        fft_min: !pow2 11
        fft_max: !pow2 18

    # Center frequency for SDR
    center_frequency: !frequency 1.6MHz  # center of the sample rate
    
    # SDR gain settings
    gain:
      # Tuner gain in dB
      tuner_gain: !dB 49.6dB
      # RTL-SDR gain mode
      rtl_agc: false
      # Tuner AGC
      tuner_agc: false
      # HackRF LNA gain in dB
      hackrf_lna_gain: !dB 0.0dB
      # HackRF VGA gain in dB
      hackrf_vga_gain: !dB 30.0dB
      # HackRF RF amplifier enable
      hackrf_amp_enable: false
      # HackRF baseband filter bandwidth
      tuner_bandwidth: 3200000
    
    # Frequency correction
    ppm: 1.0
    
    # Display settings
    display:
      # dB range for spectrum display
      min_db: !dB -120dB
      max_db: !dB 0dB
      # Visualizer padding
      padding: 20

    # Device-specific SDR settings.
    # The backend resolves !floor from the lowest concrete sample_rate in this block,
    # and !max from the device's supported ceiling.
    devices:
      rtl_sdr:
        sample_rate: !frequency 3.2MHz
        gain_limits:
          min: 0.0
          max: 49.6
          step: 0.1
        fft_display:
          markers:
            - kind: lower_limit
              freq_hz: !frequency 500kHz
              label: "RTL-SDR v4 lower limit"
            - kind: spur
              freq_hz: !frequency 28.8MHz
              label: "Potential hardware spur"
            - kind: max_hardware_frequency
              freq_hz: !frequency 1.766GHz
              label: "RTL-SDR v4 upper limit rate"
      mock_apt:
        sample_rate: !floor...!channel
        gain_limits:
          min: 0.0
          max: 49.6
          step: 0.1
      hackrf_one:
        sample_rate: !clamp
          value: !channel sample_rate
          min: !floor sample_rate
          max: !max sample_rate

        fft_sizes:
          - base: base_fft_sizes
            fft_max: !pow2 22
        gain_limits:
          lna_min: 0.0
          lna_max: 40.0
          lna_step: 8.0
          vga_min: 0.0
          vga_max: 62.0
          vga_step: 2.0
        fft_display:
          markers:
            - kind: min_hardware_frequency
              freq_hz: !frequency 1MHz
              label: "HackRF One, lower limit"
            - kind: max_hardware_frequency
              freq_hz: !frequency 6GHz
              label: "HackRF One, max upper limit"

  # Mock APT signal configuration for testing
  # Per-channel config controls where signals are generated
  mock_apt:
    gpu_gen_via_metal: false
    realistic_rf:
      enabled: false
      aliasing: true
      passband: true
      retune_settling: true
    # Per-channel mock APT configuration
    # These channels define where mock signals are generated
    # The keys (a, b, c) should match the n_apt.channels keys
    # These mock signals do not do anything or carry any content like a real N-APT signal
    channels:
      a:
        label: "A"
        freq_range_hz: !frequency_range 18kHz..4.47MHz
        description: "Channel A mock signals"
        apt_spike_density: !frequency 33kHz
        noise_floor_db: !dB -100dB
        signal_strength_range: !dB_range -80dB..-20dB
      b:
        label: "B"
        freq_range_hz: !frequency_range 24.1MHz..30.37MHz
        description: "Channel B mock signals"
        apt_spike_density: !frequency 33kHz
        noise_floor_db: !dB -100dB
        signal_strength_range: !dB_range -80dB..-20dB
      c:
        label: "C"
        freq_range_hz: !frequency_range 4.75MHz..23MHz
        description: "Channel C mock signals - the largest N-APT channel carrying vision, imagination, dreams"
        apt_spike_density: !frequency_range 33kHz..60kHz
        noise_floor_db: !dB -100dB
        signal_strength_range: !dB_range -100dB..-60dB

  triangulation:
    static:
      freq_range_hz: !frequency_range 2.3GHz..2.344GHz


  # N-APT spectrum channel definitions
  #
  # These are the real frequencies and channels that are used for N-APT
  # approximated by looking at the spectrum and adjusting the center frequency 
  # to see the signal's stable form of APT-like spikes and valleys
  #
  # These frequencies are surprisingly low in the LF/MF/HF range
  # My hypothesis is that they are used because they attenuate far less 
  # (lose less energy) as they travel through objects, obstacles,
  # and the skull/tissue before they make it back to an endpoint
  #
  # Features experienced include:
  #   - Mental inference
  #   - Auditory thought
  #   - Hearing
  #   - Voice
  #   - Audio
  #   - Speech
  #   - Reasoning
  #   - Memory (short and long term)
  #   - Perception
  #   - Behavior
  #   - Emotion
  #   - Sense of self
  #   - Awareness
  #   - Neurotransmitters
  #   - State of mind
  #   - 5 Senses (smell, sight, sound, touch, taste)
  #   - Physiological expression (muscles, haptics, etc.)
  #   - Vitals (heart, breathing, hunger, libido, etc.)
  #   - Imagination (visual, perceptual)
  #   - Vision
  #   - Dreams
  #
  n_apt:
    # Add new channels (e.g. c) and the app will pick them up on rebuild
    # and via backend hot-reload when available.
    channels:
        # A and B look nearly identical for about the first 4MHz except for a spur in B
        # B is larger and has a different shape after the identical section
        a:
          label: "A"
          freq_range_hz: !frequency_range 18kHz..4.39MHz
          description: "The potentially primary N-APT channel, notably on the lowe end of the spectrum, encompassing features like audio, voice, physiological effects and more."
        b:
          label: "B"
          freq_range_hz: !frequency_range 24.1MHz..30.37MHz
          # freq_range_hz: !frequency_range 24.72MHz..29.88MHz
          description: "This channel is sometimes identical to Channel A but has more powerful spikes, potentially due to operating on others further distant (known effects are speech, slight physiology, atttention, etc.) OR this channel being responsible for manipulating intellectual cognitive infrastructure and processing like reasoning, memory and general consciousness."
        c:
          label: "C"
          freq_range_hz: !frequency_range 4.75MHz..23MHz
          description: "This channel is the assumed largest N-APT channel, carrying heavy content and data like vision (read-only), imagination (read and write), dreams and potentially more related to visual/temporal lobe content."
