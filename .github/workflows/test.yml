name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect changes for conditional testing
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      wasm: ${{ steps.filter.outputs.wasm }}
      integration: ${{ steps.filter.outputs.integration }}
      # Helper output to run integration tests if ANY core logic changed
      needs-any-integration: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.wasm == 'true' || steps.filter.outputs.integration == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/ts/**'
              - 'src/md-preview/**'
              - 'src/types/**'
              - 'test/ts/**'
              - 'package*.json'
              - 'tsconfig*.json'
            rust:
              - 'src/rs/**'
              - 'test/rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'signals.yaml'
            wasm:
              - 'src/rs/lib.rs'
              - 'src/rs/wasm/**'
              - 'src/rs/simd/**'
              - 'test/wasm/**'
              - 'Cargo-wasm.toml'
            integration:
              - 'test/integration/**'
              - 'scripts/**'
              - 'signals.yaml'

  # Frontend tests
  frontend-tests:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run tests (Affected Only on Branches)
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npm test
          else
            npm test -- --changedSince=origin/main --passWithNoTests
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Rust tests
  rust-tests:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true' || github.ref == 'refs/heads/main'

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y librtlsdr-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust tests
        run: cargo test --profile dev-fast
        env:
          REDIS_URL: redis://localhost:6379
          UNSAFE_LOCAL_USER_PASSWORD: n-apt-dev-key

      - name: Upload Rust coverage
        uses: codecov/codecov-action@v4
        with:
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Rust Performance Tests (Release mode)
  rust-performance-tests:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y librtlsdr-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-perf-
            ${{ runner.os }}-cargo-

      - name: Run Rust Performance Tests
        run: cargo test --test performance_tests --release -- --nocapture

  # WASM tests
  wasm-tests:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.wasm == 'true' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: npm install -g wasm-pack

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run WASM tests
        run: npm run test:wasm

  # Integration tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.needs-any-integration == 'true' || github.ref == 'refs/heads/main'

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: "npm"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y librtlsdr-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
            node_modules
          key: ${{ runner.os }}-integration-${{ hashFiles('**/Cargo.lock', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-integration-
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build WASM (if changed)
        if: needs.detect-changes.outputs.wasm == 'true' || github.ref == 'refs/heads/main'
        run: npm run build:wasm

      - name: Build Rust Backend
        run: npm run build:rust

      - name: Generate Encrypted Test Artifacts
        run: cargo test --test encryption_e2e_tests generate_test_artifacts -- --nocapture

      - name: Run integration tests (Affected Only on Branches)
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npm run test:integration
          else
            npm run test:integration -- --changedSince=origin/main --passWithNoTests
          fi
        env:
          REDIS_URL: redis://localhost:6379
          UNSAFE_LOCAL_USER_PASSWORD: n-apt-dev-key
