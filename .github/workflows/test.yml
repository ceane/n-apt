name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend type checking
  frontend-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Check module reachability and script targets
        run: npm run lint:structure

  # Frontend tests
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Run all frontend tests
        run: npm test

      - name: Upload coverage reports
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: ./coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security-script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Run script security tests
        run: npm run test:security-scripts

      - name: Run capture tool regression tests
        run: npm run test:capture-tools

      - name: Run encrypted ML smoke test when local-only credentials exist
        run: npm run test:e2e:encrypted-ml

  # Rust tests
  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Include newly installed native libraries when restoring older Cargo caches.
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig

    services:
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js for authenticated Redis test provisioning
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: "npm"

      - name: Install Redis ACL provisioning dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y librtlsdr-dev libhackrf-dev redis-server

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: .
          cache-on-failure: true

      - name: Configure and verify authenticated Redis
        run: node scripts/setup/configure_test_redis.mjs

      - name: Compile check (warnings are errors)
        run: RUSTFLAGS="-D warnings" cargo check --profile dev-incremental --workspace --all-targets

      - name: Run capture integrity regression tests
        run: |
          cargo test --profile dev-incremental --lib authenticated_capture_tests
          cargo test --profile dev-incremental --lib capture_export_integrity_tests
          cargo test --profile dev-incremental --test iq_capture_format_acceptance backend_fido_files_use_stable_vault_key_and_fail_closed

      - name: Run Rust tests
        run: |
          all_tests=(
            authentication_tests
            capture_stitch_tests
            device_stream_frozen_tests
            endpoint_auth_tests
            encryption_e2e_tests
            fft_processor_tests
            frequency_scaling_e2e
            frequency_validation_tests
            iq_capture_integration_tests
            mock_apt_tests
            performance_program_tests
            server_tests
            ws_message_proptests
            yaml_config_proptests
            iq_frame_codec_proptests
            stream_manager_proptests
            stream_command_proptests
          )

          run_selected_tests() {
            for test_name in "$@"; do
              cargo nextest run --cargo-profile dev-incremental --test "$test_name"
            done
          }

          run_selected_tests "${all_tests[@]}"
        env:
          UNSAFE_LOCAL_USER_PASSWORD: n-apt-dev-key
          PROPTEST_SEED: "0xdeadbeef00000001"

      - name: Upload Rust coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Rust Performance Tests (Release mode)
  rust-performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y librtlsdr-dev redis-server

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: .
          cache-on-failure: true

      - name: Run Rust Performance Tests
        run: |
          cargo --config .cargo/performance.toml test --test performance_tests --profile release -- --nocapture
          cargo test --profile dev-incremental --test performance_program_tests

      - name: Compile report-only uncapped benchmarks
        run: cargo bench --bench pipeline_benchmarks --no-run

  # WASM tests
  wasm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Run WASM tests
        run: npm run test:wasm

  # Integration tests
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          cache: "npm"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y librtlsdr-dev redis-server

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: .
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Test Redis auth configuration
        timeout-minutes: 1
        run: node --import tsx --test test/scripts/redis_auth_setup.test.mjs

      - name: Test Redis salt fingerprints
        timeout-minutes: 1
        run: node --import tsx --test test/scripts/redis_salt_fingerprint.test.mjs

      - name: Test Redis tower staging
        timeout-minutes: 1
        run: node --import tsx --test test/scripts/redis_tower_staging.test.mjs

      - name: Test Redis ACL integration
        timeout-minutes: 1
        run: node --import tsx --test test/scripts/redis_acl.integration.test.mjs

      - name: Test capture salt backup integration
        timeout-minutes: 1
        run: node --import tsx --test test/classifier/capture-salt-backup.integration.test.mjs

      - name: Configure and verify authenticated Redis
        run: node scripts/setup/configure_test_redis.mjs

      - name: Build WASM
        run: npm run build:wasm

      - name: Build Rust Backend
        run: npm run build:rust

      - name: Generate Encrypted Test Artifacts
        run: cargo test --profile dev-incremental --test encryption_e2e_tests generate_test_artifacts -- --nocapture

      - name: Run all integration tests
        run: npm run test:integration
        env:
          UNSAFE_LOCAL_USER_PASSWORD: n-apt-dev-key
